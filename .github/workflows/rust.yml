name: Rust

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'

# Minimum permissions required by skip-duplicate-actions
permissions:
  actions: write
  contents: read
  pull-requests: write
  
env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      run: rustup update stable

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov

    - name: Build
      run: cargo build --verbose

    - name: Run test and report coverage
      run: | 
        cargo llvm-cov --no-report --no-fail-fast
        cargo llvm-cov report --ignore-filename-regex="events.rs|ui.rs|words.rs"
    
    # Attach coverage to the current pull request
    - name: Attach Coverage To Pull Request
      if: github.event_name == 'pull_request'
      run: |
        echo "## Coverage Report" > report.md
        echo "\`\`\`" >> report.md
        cargo llvm-cov report --ignore-filename-regex="events.rs|ui.rs|words.rs" >> report.md
        echo "\`\`\`" >> report.md
    
    - name: Upload Coverage Report
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-artifact
        path: |
          report.md
    
    # Attach report to pull request
    - name: Attach Coverage Report to Pull Request
      if: github.event_name == 'pull_request'
      uses: thollander/actions-comment-pull-request@v3.0.1
      with:
        file-path: report.md
    
    # Then clean up any generated files
    - name: Cleanup Generated Report
      if: github.event_name == 'pull_request'
      run: rm report.md