name: Rust

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'

# Minimum permissions required by skip-duplicate-actions
permissions:
  actions: write
  contents: read
  pull-requests: write
  
env:
  CARGO_TERM_COLOR: always

jobs:
  check-duplicate:
    # First thing if there are any duplicate actions skip them
    # otherwise it runs twice on pull requests
    runs-on: ubuntu-latest

    # Track should skip status
    outputs:
      should_skip: ${{ steps.skip-check.outputs.should_skip }}

    steps:
    - id: skip-check
      uses: fkirc/skip-duplicate-actions@v5.3.1
      with:
        concurrent_skipping: 'same_content'
        do_not_skip: '["pull_request"]'


  build_and_test:
    needs: check-duplicate
    # if no duplicate actions are occuring then run tests and coverage
    if: needs.check-duplicate.outputs.should_skip != 'true'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup Testing Tools
      run: cargo install cargo-llvm-cov

    - name: Build
      run: cargo build --verbose
    - name: Run test and coverage
      run: cargo llvm-cov --no-fail-fast --fail-under-lines 80 --no-report -- --format=terse 
    - name: Report Coverage
      run: |
        echo "# Coverage Report" > coverage_report.md
        echo \`\`\` >> coverage_report.md
        cargo llvm-cov report --ignore-filename-regex="words.rs|main.rs|events.rs|ui.rs" | tee -a coverage_report.md
        echo \`\`\` >> coverage_report.md
      
    - name: Upload Coverage Report
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: test-coverage-artiface
        path: coverage_report.md
      
    - name: Attach Test Coverage Report To Pull Request
      if: github.event_name == 'pull_request'
      uses: thollander/actions-comment-pull-request@v3.0.1
      with:
        file-path: coverage_report.md

    - name: Cleanup Generated Report
      run: rm coverage_report.md